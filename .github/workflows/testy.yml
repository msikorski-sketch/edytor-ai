# Testy przy każdym pushu na main i przy pull requestach. Czerwony wynik na GitHubie = nie wdrażaj
# (narzedzia/wdroz.sh i tak uruchamia te same testy lokalnie przed wysłaniem kodu na serwer).
name: Testy

on:
  push:
    branches: [main]
  pull_request:

# Nowy push anuluje trwający przebieg dla tej samej gałęzi — liczy się tylko najnowszy kod.
concurrency:
  group: testy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # ta sama wersja co w obrazie Dockera (node:24-slim)
          cache: npm
      # bsdtar rozpakowuje importowane archiwa ZIP (w obrazie Dockera: pakiet libarchive-tools).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libarchive-tools
      - run: npm ci
      - run: npm test
